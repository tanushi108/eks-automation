---
# ---------------------------------------------------------
# 0. Get cluster name from user
# ---------------------------------------------------------

- name: Ask for EKS cluster name
  ansible.builtin.pause:
    prompt: "Enter EKS cluster name"
  register: cluster_name_input

- name: Set cluster name
  ansible.builtin.set_fact:
    eks_cluster_name: "{{ cluster_name_input.user_input | trim }}"

- name: Display cluster name
  ansible.builtin.debug:
    msg: "EKS cluster name: {{ eks_cluster_name }}"


# ---------------------------------------------------------
# 1. Validate operation
# ---------------------------------------------------------

- name: Validate operation
  ansible.builtin.assert:
    that:
      - operation in ['create', 'verify', 'destroy']
    fail_msg: "Invalid operation '{{ operation }}'. Use create, verify, or destroy."
    success_msg: "Operation '{{ operation }}' is valid."


# ---------------------------------------------------------
# 2. Validate AWS access
# ---------------------------------------------------------

- name: Check AWS identity
  ansible.builtin.command:
    argv:
      - aws
      - sts
      - get-caller-identity
  register: aws_identity
  changed_when: false

- name: Display AWS identity
  ansible.builtin.debug:
    msg: "{{ aws_identity.stdout }}"


# ---------------------------------------------------------
# 3. Check whether EKS cluster already exists
# ---------------------------------------------------------

- name: Check EKS clusters
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - list-clusters
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: cluster_check
  changed_when: false

- name: Set cluster existence fact
  ansible.builtin.set_fact:
    cluster_exists: >-
      {{
        eks_cluster_name in
        ((cluster_check.stdout | from_json).clusters | default([]))
      }}

- name: Display cluster status
  ansible.builtin.debug:
    msg: "EKS cluster '{{ eks_cluster_name }}' exists: {{ cluster_exists }}"


# ---------------------------------------------------------
# 4. CREATE
# ---------------------------------------------------------

- name: Generate eksctl configuration
  ansible.builtin.template:
    src: eks-cluster.yaml.j2
    dest: "{{ eksctl_config }}"
    mode: "0644"
  when:
    - operation == "create"
    - not cluster_exists

- name: Create EKS cluster
  ansible.builtin.command:
    argv:
      - eksctl
      - create
      - cluster
      - -f
      - "{{ eksctl_config }}"
  when:
    - operation == "create"
    - not cluster_exists

- name: Update kubeconfig after cluster creation
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - update-kubeconfig
      - --region
      - "{{ aws_region }}"
      - --name
      - "{{ eks_cluster_name }}"
  when:
    - operation == "create"
    - not cluster_exists

- name: Wait for Kubernetes API
  ansible.builtin.command:
    cmd: kubectl get nodes
  register: kubectl_nodes
  retries: 20
  delay: 15
  until: kubectl_nodes is succeeded
  changed_when: false
  when:
    - operation == "create"
    - not cluster_exists

- name: Display Kubernetes nodes
  ansible.builtin.debug:
    var: kubectl_nodes.stdout
  when:
    - operation == "create"
    - not cluster_exists


# ---------------------------------------------------------
# 5. VERIFY
# ---------------------------------------------------------

- name: Update kubeconfig for verification
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - update-kubeconfig
      - --region
      - "{{ aws_region }}"
      - --name
      - "{{ eks_cluster_name }}"
  when:
    - operation == "verify"
    - cluster_exists

- name: Get Kubernetes nodes
  ansible.builtin.command:
    cmd: kubectl get nodes -o wide
  register: verify_nodes
  changed_when: false
  when:
    - operation == "verify"
    - cluster_exists

- name: Display Kubernetes nodes
  ansible.builtin.debug:
    var: verify_nodes.stdout
  when:
    - operation == "verify"
    - cluster_exists

- name: Get all Kubernetes pods
  ansible.builtin.command:
    cmd: kubectl get pods -A
  register: verify_pods
  changed_when: false
  when:
    - operation == "verify"
    - cluster_exists

- name: Display Kubernetes pods
  ansible.builtin.debug:
    var: verify_pods.stdout
  when:
    - operation == "verify"
    - cluster_exists


# ---------------------------------------------------------
# 6. DESTROY
# ---------------------------------------------------------

- name: Delete EKS cluster
  ansible.builtin.command:
    argv:
      - eksctl
      - delete
      - cluster
      - --name
      - "{{ eks_cluster_name }}"
      - --region
      - "{{ aws_region }}"
      - --wait
  when:
    - operation == "destroy"
    - cluster_exists

- name: Verify EKS cluster deletion
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - list-clusters
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: remaining_clusters
  changed_when: false
  when:
    - operation == "destroy"

- name: Display remaining EKS clusters
  ansible.builtin.debug:
    msg: >-
      Remaining EKS clusters:
      {{ (remaining_clusters.stdout | from_json).clusters | default([]) }}
  when:
    - operation == "destroy"