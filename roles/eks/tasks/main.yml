---
# Validate operation

- name: Validate operation
  ansible.builtin.assert:
    that:
      - operation in ['create', 'verify', 'destroy']
    fail_msg: "Invalid operation '{{ operation }}'. Use create, verify, or destroy."


# Check AWS access

- name: Check AWS identity
  ansible.builtin.command:
    argv:
      - aws
      - sts
      - get-caller-identity
  changed_when: false


# Check whether cluster exists

- name: Check EKS clusters
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - list-clusters
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: cluster_check
  changed_when: false

- name: Set cluster existence fact
  ansible.builtin.set_fact:
    cluster_exists: >-
      {{
        eks_cluster_name in
        ((cluster_check.stdout | from_json).clusters | default([]))
      }}


# CREATE

- name: Generate eksctl configuration
  ansible.builtin.template:
    src: eks-cluster.yaml.j2
    dest: "{{ eksctl_config }}"
    mode: "0644"
  when:
    - operation == "create"
    - not cluster_exists

- name: Create EKS cluster
  ansible.builtin.command:
    argv:
      - eksctl
      - create
      - cluster
      - -f
      - "{{ eksctl_config }}"
  when:
    - operation == "create"
    - not cluster_exists

- name: Update kubeconfig
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - update-kubeconfig
      - --region
      - "{{ aws_region }}"
      - --name
      - "{{ eks_cluster_name }}"
  when:
    - operation == "create"
    - not cluster_exists

- name: Wait for Kubernetes API
  ansible.builtin.command:
    cmd: kubectl get nodes
  register: kubectl_nodes
  retries: 20
  delay: 15
  until: kubectl_nodes is succeeded
  changed_when: false
  when:
    - operation == "create"
    - not cluster_exists


# VERIFY

# VERIFY

- name: Verify EKS cluster
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - describe-cluster
      - --name
      - "{{ eks_cluster_name }}"
      - --region
      - "{{ aws_region }}"
      - --query
      - "cluster.{Name:name,Status:status,Version:version}"
      - --output
      - table
  register: cluster_status
  changed_when: false
  when:
    - operation == "verify"
    - cluster_exists

- name: Display cluster status
  ansible.builtin.debug:
    var: cluster_status.stdout
  when:
    - operation == "verify"
    - cluster_exists

# DESTROY

- name: Delete EKS cluster
  ansible.builtin.command:
    argv:
      - eksctl
      - delete
      - cluster
      - --name
      - "{{ eks_cluster_name }}"
      - --region
      - "{{ aws_region }}"
      - --wait
  when:
    - operation == "destroy"
    - cluster_exists

- name: Verify EKS cluster deletion
  ansible.builtin.command:
    argv:
      - aws
      - eks
      - list-clusters
      - --region
      - "{{ aws_region }}"
      - --output
      - json
  register: remaining_clusters
  changed_when: false
  when:
    - operation == "destroy"
    - cluster_exists
