apiVersion: eksctl.io/v1alpha5

kind: ClusterConfig

metadata:
  name: c1
  region: ap-south-1
  version: "1.35"

iam:
  withOIDC: true

managedNodeGroups:
  - name: c1-workers

    instanceType: t3.small

    minSize: 1
    desiredCapacity: 1
    maxSize: 2

    volumeSize: 20
    volumeType: gp3

    labels:
      role: worker

    tags:
      Project: devops-eks-automation
      Environment: learning

    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        cloudWatch: true